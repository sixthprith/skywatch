name: Rebuild calendar feed

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  push:
    branches: [main]
    paths: ["events.json", "scripts/build_ics.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_ics.py
      - name: Commit if changed
        run: |
          git config user.name "sky-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add feed.ics
          git diff --staged --quiet || git commit -m "Refresh calendar feed"
          git push
