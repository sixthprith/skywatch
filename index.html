<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Watch — Launches &amp; Airshows</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#efe5cd;--ink:#3b3226;--ink-2:#6b5f4c;--magenta:#a8306a;--blue:#2b5f92;--rule:#c8b895}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:'Barlow',system-ui,sans-serif;color:var(--ink);background:var(--paper);overflow:hidden}
  a{color:var(--blue)}a:hover{color:var(--magenta)}
  #map{position:absolute;inset:0}
  .leaflet-container{background:var(--paper)}
  .leaflet-tile-pane{filter:sepia(.72) saturate(.55) brightness(1.12) contrast(.82) hue-rotate(-8deg);opacity:.85}
  .grain{position:absolute;inset:0;pointer-events:none;z-index:400;mix-blend-mode:multiply;
    background:repeating-linear-gradient(0deg,rgba(59,50,38,.05) 0 1px,transparent 1px 44px),
      repeating-linear-gradient(90deg,rgba(59,50,38,.05) 0 1px,transparent 1px 44px),
      radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(90,70,40,.2))}

  .panel{position:absolute;z-index:500;top:20px;left:20px;bottom:20px;width:392px;display:flex;flex-direction:column;
    background:linear-gradient(#f7f0de,#efe5cd);border:1px solid #b9a67e;border-radius:16px;overflow:hidden;
    box-shadow:0 18px 44px rgba(52,40,20,.35),inset 0 1px 0 #fffaf0,inset 0 -1px 0 rgba(120,95,55,.3)}
  .phead{padding:13px 16px 11px;border-bottom:1.5px solid var(--ink);background:#f9f3e4}
  .toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .kicker{font-family:'Barlow Condensed';font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--magenta);font-weight:600}
  .ptitle{font-family:'Barlow Condensed';font-size:29px;font-weight:700;letter-spacing:.02em;line-height:1;margin:4px 0 0}
  .psub{font-size:11.5px;color:var(--ink-2);margin-top:5px;letter-spacing:.05em}
  .locsw{display:flex;border:1px solid var(--ink-2);border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(255,255,255,.7),0 1px 2px rgba(90,70,40,.25)}
  .locsw button{font-family:'Barlow Condensed';font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
    padding:5px 11px 4px;background:transparent;border:0;color:var(--ink-2);cursor:pointer}
  .locsw button[aria-pressed="true"]{background:linear-gradient(#57493a,#3b3226);color:#f7f0de;box-shadow:inset 0 1px 1px rgba(255,255,255,.25)}

  .filters{position:relative;padding:14px 16px 13px;display:flex;flex-direction:column;gap:10px;
    border-top:1px solid rgba(255,255,255,.7);border-bottom:1px solid #8d8677;
    background:linear-gradient(#eeebe4,#d5d0c4 42%,#bdb7aa);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 5px rgba(80,72,58,.28)}
  .filters::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 1px,transparent 1px 3px);opacity:.8}
  .filters>*{position:relative}
  .screw{position:absolute;width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%,#f2efe8,#a29b8c 62%,#6f6858);
    box-shadow:inset 0 -1px 1px rgba(255,255,255,.6),0 1px 1px rgba(255,255,255,.5)}
  .screw::after{content:'';position:absolute;left:1.5px;top:3.8px;width:6px;height:1.4px;border-radius:1px;
    background:rgba(60,54,42,.75);transform:rotate(28deg)}
  .screw.a{left:6px;top:6px}.screw.b{right:6px;top:6px}.screw.c{left:6px;bottom:6px}.screw.d{right:6px;bottom:6px}
  .frow{display:flex;gap:6px;flex-wrap:wrap}
  /* annunciator lamps: recessed housing, lamp lights rather than fills */
  .chip{font-family:'Barlow Condensed';font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;
    padding:5px 10px 4px;border:1px solid #6f6858;border-radius:6px;cursor:pointer;min-height:30px;
    color:#8f8878;background:linear-gradient(#332f28,#1e1b16);
    display:flex;align-items:center;gap:7px;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.75),inset 0 -1px 0 rgba(255,255,255,.08),0 1px 0 rgba(255,255,255,.7)}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:#4a4640;
    box-shadow:inset 0 1px 1px rgba(0,0,0,.85),inset 0 -1px 1px rgba(255,255,255,.12)}
  .chip[aria-pressed="true"]{color:#fff8e8;background:linear-gradient(#3b362d,#26221b)}
  .rangerow{display:flex;align-items:center;gap:14px;padding-top:2px}
  .dial{position:relative;width:104px;height:104px;flex:none}
  .scale{position:absolute;inset:0;width:104px;height:104px}
  .knob{position:absolute;left:16px;top:16px;width:72px;height:72px;border-radius:50%;cursor:grab;touch-action:none;
    background:repeating-conic-gradient(from 0deg,#e4e0d6 0 2.2deg,#a9a294 2.2deg 4.4deg);
    box-shadow:0 2px 4px rgba(60,52,38,.45),inset 0 0 0 1px rgba(255,255,255,.35)}
  .knob:active{cursor:grabbing}
  .knob:focus-visible{outline:2px solid var(--magenta);outline-offset:3px}
  .knob .cap{position:absolute;left:9px;top:9px;width:54px;height:54px;border-radius:50%;
    background:radial-gradient(circle at 38% 26%,#fbf9f3,#cdc7b9 55%,#8f8878);
    box-shadow:inset 0 -3px 6px rgba(70,62,46,.4),inset 0 2px 3px rgba(255,255,255,.85),0 1px 2px rgba(60,52,38,.4)}
  .knob .mark{position:absolute;left:50%;top:6px;width:3px;height:16px;margin-left:-1.5px;border-radius:2px;z-index:2;
    background:linear-gradient(#8a2159,#5d1038);box-shadow:0 1px 1px rgba(255,255,255,.5)}
  .dread{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;font-family:'Barlow Condensed';color:var(--ink)}
  .dread .dk{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#5f584a;width:100%}
  #rlbl{font-size:30px;font-weight:700;line-height:.9;letter-spacing:.01em}
  .dread .du{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#5f584a}
  .dread .dhint{width:100%;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7b7466}
  .rangerow.live #rlbl{color:#20803f}
  .rangerow.live .mark{background:linear-gradient(#4fbf72,#1c7038)}

  .list{flex:1;overflow:auto}
  .item{border-bottom:1px solid rgba(200,184,149,.7);cursor:pointer;margin:6px 10px;border-radius:14px;border-bottom:0;
    background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,0));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 1px 2px rgba(90,70,40,.14)}
  .item:hover{background:rgba(168,48,106,.07)}
  .item.on{background:linear-gradient(rgba(168,48,106,.16),rgba(168,48,106,.08));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 6px rgba(90,70,40,.22)}
  .row{display:grid;grid-template-columns:32px 1fr 74px;gap:11px;align-items:center;padding:11px 13px}
  .detail{max-height:0;overflow:hidden;transition:max-height .28s ease;padding:0 13px 0 56px}
  .item.on .detail{max-height:220px}
  .dline{display:flex;gap:8px;align-items:baseline;font-size:11.5px;color:var(--ink-2);letter-spacing:.04em;
    padding:4px 0;border-top:1px dashed rgba(200,184,149,.9)}
  .dline:last-child{padding-bottom:11px}
  .dk{font-family:'Barlow Condensed';font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--magenta);min-width:56px}
  .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:'Barlow Condensed';
    font-weight:700;font-size:16px;box-shadow:inset 0 -3px 6px rgba(0,0,0,.28),inset 0 2px 3px rgba(255,255,255,.55),0 1px 2px rgba(0,0,0,.3)}
  .iname{font-family:'Barlow Condensed';font-size:17.5px;font-weight:600;line-height:1.12}
  .imeta{font-size:11px;color:var(--ink-2);margin-top:3px;letter-spacing:.05em}
  .tminus{font-family:'Barlow Condensed';font-size:12px;letter-spacing:.1em;color:var(--magenta);font-weight:600;margin-top:3px}
  .tminus.past{color:var(--ink-2)}
  .wx{display:inline-flex;align-items:center;gap:4px;margin-left:8px;color:var(--blue);letter-spacing:.06em}
  .brg{white-space:nowrap;font-family:'Barlow Condensed';letter-spacing:.05em;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .visbadge{display:flex;align-items:center;gap:3px;padding:2px 6px;border-radius:999px;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 2px rgba(90,70,40,.2)}
  .visbadge.y{background:linear-gradient(#a9e3bd,#5fb87c);color:#123d22;border:1px solid #4c9a66}
  .visbadge.n{background:linear-gradient(#e6dcc4,#cdbf9d);color:#5b5140;border:1px solid #b4a37c}
  .visbadge svg{display:block}
  .brg .arrow{display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;font-size:15px;margin:0 0 4px;color:var(--magenta)}
  .brg .d{font-size:15px;font-weight:600}
  .brg .b{font-size:11px;color:var(--ink-2)}
  .empty{padding:26px 18px;border-radius:12px;font-size:13px;color:var(--ink-2);text-align:center;letter-spacing:.04em}

  /* iOS 6 pins */
  .pin{position:relative;width:36px;height:50px}
  .pin .shade{position:absolute;left:9px;bottom:0;width:18px;height:7px;border-radius:50%;
    background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.5),rgba(0,0,0,0) 70%)}
  .pin .tail{position:absolute;left:15px;top:26px;width:6px;height:20px;
    background:linear-gradient(90deg,#7c0f08,#e0483a 40%,#8d1109);clip-path:polygon(0 0,100% 0,58% 100%,42% 100%)}
  .pin .body{position:absolute;left:1px;top:0;width:34px;height:34px;border-radius:50%;
    background:radial-gradient(120% 120% at 34% 20%,rgba(255,255,255,.95) 0%,rgba(255,255,255,.42) 22%,rgba(255,255,255,0) 44%),
      linear-gradient(#ff8a78 0%,#f0463a 34%,#c4160c 68%,#8b0a04 100%);
    border:1px solid rgba(70,4,0,.75);
    box-shadow:inset 0 -7px 11px rgba(90,0,0,.45),inset 0 1px 1px rgba(255,255,255,.85),0 3px 5px rgba(0,0,0,.42)}
  .pin .gloss{position:absolute;left:6px;top:3px;width:24px;height:13px;border-radius:50% 50% 60% 60%;
    background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,.05));filter:blur(.4px);pointer-events:none}
  .pin .cat{position:absolute;left:24px;top:22px;width:13px;height:13px;border-radius:50%;border:1.5px solid #fff8ec;
    box-shadow:0 1px 2px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.6)}
  .pin span{position:absolute;left:1px;top:0;width:34px;height:34px;display:grid;place-items:center;color:#fff;
    font-family:'Barlow Condensed';font-weight:700;font-size:19px;text-shadow:0 -1px 1px rgba(120,0,0,.7),0 1px 1px rgba(255,255,255,.25)}
  .pin.sel{transform:scale(1.16);transform-origin:50% 100%}
  .pin.sel .body{box-shadow:inset 0 -7px 11px rgba(90,0,0,.45),inset 0 1px 1px rgba(255,255,255,.85),0 5px 9px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.7)}

  .home{width:64px;height:64px;position:relative}
  .home .puck{position:absolute;left:22px;top:22px;width:20px;height:20px;border-radius:50%;border:2.5px solid #fff;
    background:radial-gradient(circle at 35% 30%,#8fc3ff,#1a6fd4 60%,#0a3f86);box-shadow:0 2px 5px rgba(0,0,0,.5)}
  .home .halo{position:absolute;inset:0;border-radius:50%;background:rgba(43,95,146,.16);border:1px solid rgba(43,95,146,.4);
    animation:pulse 3s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1);opacity:0}}
  .hlabel{font-family:'Barlow Condensed';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
    background:linear-gradient(rgba(252,247,235,.95),rgba(240,231,208,.92));padding:2px 8px;border:1px solid var(--rule);
    white-space:nowrap;border-radius:999px;box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(90,70,40,.3)}
  .ring-lbl{font-family:'Barlow Condensed';font-size:11px;letter-spacing:.14em;color:var(--magenta);background:var(--paper);padding:0 4px;border-radius:999px}
  .ring-lbl.act{color:#fff;background:linear-gradient(#4fbf72,#20803f);padding:1px 7px;font-weight:600;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 1px 3px rgba(20,60,30,.4)}
  .compass{font-family:'Barlow Condensed';font-size:11.5px;letter-spacing:.13em;color:var(--ink-2)}

  /* callout */
  .leaflet-popup-content-wrapper{background:linear-gradient(#f9f3e4,#efe5cd);color:var(--ink);border:1px solid #b9a67e;
    border-radius:14px;box-shadow:0 14px 30px rgba(52,40,20,.4)}
  .leaflet-popup-content{margin:11px 13px;width:246px!important}
  .leaflet-popup-tip{background:#efe5cd;border:1px solid #b9a67e}
  .co-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .co-more{width:24px;height:24px;flex:none;border-radius:50%;cursor:pointer;color:var(--ink);
    border:1px solid #b19c72;background:linear-gradient(#fdf8ec,#e7dcc0);display:grid;place-items:center;
    box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(90,70,40,.3);transition:transform .25s ease}
  .co-more:hover{background:linear-gradient(#fffdf6,#eee3c9)}
  .co-more[aria-expanded="true"]{transform:rotate(180deg)}
  .co-ex{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .co-ex.open{max-height:260px}
  .co-link{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;margin-top:2px;
    font-family:'Barlow Condensed';font-size:14px;font-weight:600;letter-spacing:.04em;text-decoration:none;
    color:var(--blue);padding:3px 9px;border-radius:999px;border:1px solid #a9bdd2;
    background:linear-gradient(#fbfaf4,#e6ddc6);box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(90,70,40,.25)}
  .co-link:hover{color:var(--magenta);border-color:#cfa3ba;background:linear-gradient(#fffdf7,#f0e4d3)}
  .co-exrow{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--ink-2);letter-spacing:.03em;
    padding:7px 0 0;margin-top:7px;border-top:1px dashed var(--rule)}
  .co-cat{font-family:'Barlow Condensed';font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
  .co-name{font-family:'Barlow Condensed';font-size:20px;font-weight:700;line-height:1.1;margin:3px 0 4px}
  .co-site{font-size:11.5px;color:var(--ink-2);letter-spacing:.04em}
  .co-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--rule)}
  .co-k{font-family:'Barlow Condensed';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
  .co-v{font-family:'Barlow Condensed';font-size:16px;font-weight:600}

  .credit{position:absolute;right:14px;bottom:26px;z-index:500;font-size:10px;color:var(--ink-2);letter-spacing:.06em}
  .leaflet-control-attribution{background:rgba(247,240,222,.95)!important;font-size:9px!important;position:relative;z-index:800}
  .leaflet-bottom.leaflet-right{z-index:800}
  .rose{position:absolute;right:24px;top:24px;z-index:500;width:112px;height:112px;opacity:.7}

  .fc{font-family:'Barlow Condensed';font-size:10px;letter-spacing:.12em;font-weight:700;color:#fff;
    padding:1px 6px;border-radius:3px;margin-left:7px;vertical-align:1px}
  .fc-VFR{background:#20803f}.fc-MVFR{background:#2b5f92}.fc-IFR{background:#9a2b1e}
  .fc-LIFR{background:#a8306a}.fc-NA{background:#6b5f4c}
  .co-ics{margin-left:6px;cursor:pointer;font-family:'Barlow Condensed';font-size:14px;font-weight:600;
    letter-spacing:.04em;color:var(--ink);padding:3px 9px;border-radius:999px;border:1px solid #b19c72;
    background:linear-gradient(#fdf8ec,#e7dcc0);box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(90,70,40,.25)}
  .co-ics:hover{color:var(--magenta);border-color:#cfa3ba}
  .boot{padding:26px 18px;font-size:12.5px;color:var(--ink-2);text-align:center;letter-spacing:.06em}
  .boot.err{color:#9a2b1e;text-align:left;line-height:1.5}
  @media (max-width:860px){
    .panel{top:auto;left:0;right:0;bottom:0;width:auto;height:58%;border-radius:20px 20px 0 0;border-bottom:0}
    .rose{width:78px;height:78px;right:14px;top:14px}
    .credit{bottom:calc(56% + 8px);right:12px}
    .list{overscroll-behavior:contain}
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="grain"></div>
<svg class="rose" viewBox="0 0 120 120" fill="none" stroke="#a8306a">
  <circle cx="60" cy="60" r="52" stroke-width="1"/><circle cx="60" cy="60" r="42" stroke-width=".6"/>
  <g id="ticks"></g>
  <path d="M60 8 L66 56 L60 62 L54 56 Z" fill="#a8306a" stroke="none"/>
  <text x="60" y="78" text-anchor="middle" font-family="Barlow Condensed" font-size="11" fill="#3b3226" stroke="none" letter-spacing="2">TRUE N</text>
</svg>

<aside class="panel">
  <div class="phead">
    <div class="toprow">
      <div class="kicker">Sectional · <span id="locname">Gainesville</span></div>
      <div class="locsw" id="locsw">
        <button data-loc="gnv" aria-pressed="true">GNV</button>
        <button data-loc="mco" aria-pressed="false">MCO</button>
      </div>
    </div>
    <h1 class="ptitle">Launches &amp; Airshows</h1>
    <div class="psub" id="stamp"></div>
  </div>
  <div class="filters">
    <i class="screw a"></i><i class="screw b"></i><i class="screw c"></i><i class="screw d"></i>
    <div class="frow" id="cats"></div>
    <div class="frow" id="whens">
      <button class="chip" data-when="7" aria-pressed="false">7 days</button>
      <button class="chip" data-when="30" aria-pressed="true">30 days</button>
      <button class="chip" data-when="365" aria-pressed="false">Season</button>
    </div>
    <div class="frow" id="layers">
      <button class="chip" data-layer="wx" aria-pressed="false"><i class="dot"></i>Sky conditions</button>
    </div>
    <div class="rangerow" id="rrow">
      <div class="dial">
        <svg viewBox="0 0 108 108" class="scale"><g id="dticks"></g></svg>
        <div class="knob" id="knob" tabindex="0" role="slider" aria-valuemin="25" aria-valuemax="250" aria-valuenow="125"
             aria-label="Search radius, nautical miles"><i class="mark"></i><i class="cap"></i></div>
      </div>
      <div class="dread"><span class="dk">Radius</span><span id="rlbl">125</span><span class="du">nm</span>
        <span class="dhint">drag or scroll</span></div>
    </div>
  </div>
  <div class="list" id="list"></div>
</aside>
<div class="credit">Launches: Launch Library 2 · airshows: events.json · bearings true · distances nautical</div>

<script>
const LOCS={gnv:{name:'Gainesville',ll:[29.652,-82.325],label:'You · 29°39′N 082°20′W'},
            mco:{name:'Orlando',ll:[28.538,-81.379],label:'You · 28°32′N 081°23′W'}};
const CATS=[
 {id:'rocket',label:'Launches',c:['#ff6a5b','#c8241a','#8d0f08']},
 {id:'air',label:'Airshows',c:['#6fb0ea','#1f5f9e','#0d3663']},
 {id:'mil',label:'Military',c:['#9cc96c','#4a7b28','#264610']},
 {id:'flyin',label:'Fly-ins',c:['#ffd07a','#d48a12','#8a5304']},
 {id:'museum',label:'Museums',c:['#c9a7e6','#7a45ad','#42206b']},
];
const CC=Object.fromEntries(CATS.map(c=>[c.id,c]));
let EVENTS=[];
let feedNote='',wxNote='';

const LL_API='https://ll.thespacedevs.com/2.3.0/launches/upcoming/?limit=60';
const FL_PAD=/florida|, fl|cape canaveral|kennedy/i;

function launchWindow(l){
  const a=l.window_start?new Date(l.window_start):null,b=l.window_end?new Date(l.window_end):null;
  if(!a||!b||isNaN(a)||isNaN(b))return 'Window TBD';
  const mins=Math.round((b-a)/6e4);
  if(mins<=0)return 'Instantaneous';
  if(mins<60)return mins+' min window';

  const cont=map.getContainer().getBoundingClientRect();
  const r=document.querySelector('.panel').getBoundingClientRect(),wide=innerWidth>860;
  const pad={l:wide?r.right+24:20,r:20,t:20,b:wide?34:innerHeight-r.top+24};
  const size=map.getSize(),vw=size.x-pad.l-pad.r,vh=size.y-pad.t-pad.b;
  const boxes=[];
  const add=el=>{if(!el)return;const b=el.getBoundingClientRect();
    boxes.push({l:b.left-cont.left,r:b.right-cont.left,t:b.top-cont.top,b:b.bottom-cont.top});};
  add(m.getElement());
  const pop=m.getPopup();if(pop&&map.hasLayer(pop))add(pop.getElement());
  const h=map.latLngToContainerPoint(LOCS[state.loc].ll);
  boxes.push({l:h.x-26,r:h.x+26,t:h.y-26,b:h.y+26});
  const box={l:Math.min(...boxes.map(b=>b.l)),r:Math.max(...boxes.map(b=>b.r)),
             t:Math.min(...boxes.map(b=>b.t)),b:Math.max(...boxes.map(b=>b.b))};
  // too big for the clear area: step the scale out and try again
  if((box.r-box.l>vw||box.b-box.t>vh)&&(tries||0)<2&&map.getZoom()>5){
    map.once('moveend',()=>setTimeout(()=>reveal(i,(tries||0)+1),40));
    map.setZoom(map.getZoom()-1);return;}
  let dx=0,dy=0;
  if(box.l<pad.l)dx=pad.l-box.l; else if(box.r>size.x-pad.r)dx=(size.x-pad.r)-box.r;
  if(box.t<pad.t)dy=pad.t-box.t; else if(box.b>size.y-pad.b)dy=(size.y-pad.b)-box.b;
  if(Math.abs(dx)<2&&Math.abs(dy)<2)return;
  map.panBy([-dx,-dy],{animate:true,duration:.5});}

document.getElementById('cats').onclick=ev=>{const b=ev.target.closest('.chip');if(!b)return;
  const on=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!on));syncChip(b);
  on?state.cats.delete(b.dataset.cat):state.cats.add(b.dataset.cat);sel=null;clear();render();};
document.getElementById('whens').onclick=ev=>{const b=ev.target.closest('.chip');if(!b)return;
  document.querySelectorAll('#whens .chip').forEach(c=>c.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');state.when=+b.dataset.when;sel=null;clear();render();};
document.getElementById('locsw').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;
  document.querySelectorAll('#locsw button').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');state.loc=b.dataset.loc;sel=null;clear();
  drawFrame();drawActive();render();map.setZoom(8,{animate:false});frameHome(true);};
// engraved dial: -135°..+135° sweeps 25..250 nm, detented every 25
const knob=document.getElementById('knob'),rrow=document.getElementById('rrow'),rlbl=document.getElementById('rlbl');
const A0=-135,A1=135,RMIN=25,RMAX=250;
const ang=v=>A0+(A1-A0)*(v-RMIN)/(RMAX-RMIN);
let rt=null;
function setRadius(v,quiet){
  v=Math.max(RMIN,Math.min(RMAX,Math.round(v/5)*5));
  if(v===state.radius)return;
  state.radius=v;rlbl.textContent=v;knob.style.transform=`rotate(${ang(v)}deg)`;
  knob.setAttribute('aria-valuenow',v);
  rrow.classList.add('live');clearTimeout(rt);rt=setTimeout(()=>rrow.classList.remove('live'),1100);
  sel=null;clear();drawActive();if(!quiet)render();}
knob.style.transform=`rotate(${ang(state.radius)}deg)`;
function fromPointer(ev){const r=knob.getBoundingClientRect();
  let a=Math.atan2(ev.clientX-(r.left+r.width/2),(r.top+r.height/2)-ev.clientY)*180/Math.PI;
  a=Math.max(A0,Math.min(A1,a));
  setRadius(RMIN+(a-A0)/(A1-A0)*(RMAX-RMIN));}
knob.addEventListener('pointerdown',e=>{knob.setPointerCapture(e.pointerId);fromPointer(e);e.preventDefault();});
knob.addEventListener('pointermove',e=>{if(knob.hasPointerCapture(e.pointerId))fromPointer(e);});
knob.addEventListener('wheel',e=>{e.preventDefault();setRadius(state.radius-Math.sign(e.deltaY)*5);},{passive:false});
knob.addEventListener('keydown',e=>{const k={ArrowUp:5,ArrowRight:5,ArrowDown:-5,ArrowLeft:-5,PageUp:25,PageDown:-25}[e.key];
  if(k){e.preventDefault();setRadius(state.radius+k);}});
// engraved scale: detent ticks every 25 nm, labelled every 50
{let g='';for(let v=RMIN;v<=RMAX;v+=25){const a=ang(v),maj=v%50===25?0:1;
  g+=`<g transform="rotate(${a} 54 54)"><line x1="54" y1="${maj?5:7}" x2="54" y2="${maj?13:12}" stroke="#5f584a" stroke-width="${maj?1.7:1}" stroke-linecap="round" opacity=".85"/></g>`;}
 for(let v=RMIN;v<=RMAX;v+=75){const a=(ang(v)-90)*Math.PI/180,R=44;
  g+=`<text x="${54+R*Math.cos(a)}" y="${54+R*Math.sin(a)+3.5}" text-anchor="middle" font-family="Barlow Condensed" font-size="9.5" fill="#5f584a" letter-spacing=".5">${v}</text>`;}
 document.getElementById('dticks').innerHTML=g;}

let s='';for(let a=0;a<360;a+=10){s+=`<line x1="60" y1="8" x2="60" y2="${60-(a%30?46:40)}" stroke-width="${a%30?.5:1}" transform="rotate(${a} 60 60)"/>`;}
document.getElementById('ticks').innerHTML=s;
/* ---------- calendar download, one event at a time ---------- */
function icsStamp(d,allDay){const z=n=>String(n).padStart(2,'0');
  return allDay?d.getUTCFullYear()+z(d.getUTCMonth()+1)+z(d.getUTCDate())
   :d.getUTCFullYear()+z(d.getUTCMonth()+1)+z(d.getUTCDate())+'T'+z(d.getUTCHours())+z(d.getUTCMinutes())+'00Z';}
function downloadICS(e){
  const allDay=e.cat!=='rocket',start=new Date(e.t);
  const end=allDay?new Date(new Date((e.endDay||e.t.slice(0,10))+'T12:00:00').getTime()+864e5)
                  :new Date(start.getTime()+36e5);
  const esc=t=>String(t||'').replace(/[\\,;]/g,' ').replace(/\s+/g,' ').slice(0,300);
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Sky Watch//EN','BEGIN:VEVENT',
   'UID:'+e.id+'@skywatch','DTSTAMP:'+icsStamp(new Date(),false),
   allDay?'DTSTART;VALUE=DATE:'+icsStamp(start,true):'DTSTART:'+icsStamp(start,false),
   allDay?'DTEND;VALUE=DATE:'+icsStamp(end,true):'DTEND:'+icsStamp(end,false),
   'SUMMARY:'+esc(e.n),'LOCATION:'+esc(e.site),'DESCRIPTION:'+esc(e.detail||e.visNote),
   'BEGIN:VALARM','TRIGGER:-PT3H','ACTION:DISPLAY','DESCRIPTION:Sky Watch','END:VALARM',
   'END:VEVENT','END:VCALENDAR'];
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar'}));
  a.download=e.id+'.ics';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
document.addEventListener('click',ev=>{const b=ev.target.closest('.co-ics');if(!b)return;
  const e=shown()[+b.dataset.ics];if(e)downloadICS(e);});

/* ---------- the sky-conditions lamp: lazy, and honest when refused ---------- */
{const lb=document.querySelector('#layers .chip');lb.dataset.c='#6fb0ea';syncChip(lb);}
document.getElementById('layers').onclick=async ev=>{
  const b=ev.target.closest('.chip');if(!b||wxBusy)return;
  wxOn=!wxOn;b.setAttribute('aria-pressed',String(wxOn));syncChip(b);
  if(wxOn&&!WX&&!wxErr){
    wxBusy=true;b.querySelector('.dot').style.background='#d48a12';
    try{WX=await loadWx();wxErr=null;}
    catch(err){wxErr=/Failed to fetch|NetworkError|CORS/i.test(err.message)
      ?'Aviation Weather Center refused the browser request — no CORS header.':err.message;}
    wxBusy=false;syncChip(b);}
  wxNote=wxOn&&wxErr?('sky layer off — '+wxErr):'';
  sel=null;clear();render();};

/* ---------- boot ---------- */
const setBoot=(html,cls)=>{listEl.innerHTML=`<div class="boot ${cls||''}">${html}</div>`;};
async function boot(){
  drawFrame();drawActive();frameHome(false);
  setBoot('Reading the sky…');
  const [cur,lau]=await Promise.allSettled([loadCurated(),loadLaunches()]);
  const notes=[];let got=[];
  if(cur.status==='fulfilled')got=got.concat(cur.value);
  else notes.push('curated list unavailable');
  if(lau.status==='fulfilled')got=got.concat(lau.value);
  else notes.push(lau.reason.message);
  EVENTS=got;feedNote=notes.join(' · ');
  if(!EVENTS.length){setBoot('Nothing loaded.<br>'+(notes.join('<br>')||'Both feeds are quiet.'),'err');return;}
  buildChips();render();
}
boot();

// Only the countdown text is rewritten each second; pins and popups stay put.
setInterval(()=>{
  if(!EVENTS.length)return;
  const ev=shown();
  listEl.querySelectorAll('.item').forEach(el=>{
    const e=ev[+el.dataset.i];if(!e)return;
    const tt=el.querySelector('.tt');if(!tt)return;
    const t=tminus(e.t,e.standing);
    if(tt.textContent!==t.s)tt.textContent=t.s;});
},1000);
map.on('zoomend',()=>{const k=sel;render();if(k!==null&&markers[k]){sel=null;focus(k,true);}});
